name: Endpoint Probe

# One-off diagnostic: does a GitHub runner reach the OTA/airline sites,
# and what real fare endpoints do they call? Manual trigger only.
# Artifacts: discovery_results.json + screenshots of every page tried.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run discovery probe
        run: python probe/discover.py

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe/
          retention-days: 7
