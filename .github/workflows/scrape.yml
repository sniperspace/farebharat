name: FareBharat Real Scrape (6-hourly)

# Scrapes real fares (Ixigo stream API) every 6 hours, rebuilds APIx,
# commits the DB back — Streamlit Cloud auto-redeploys on the new commit.
# Demo-data top-up stays as a clearly-labelled fallback only.

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}      # manual test button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Ensure data folders exist
        run: mkdir -p data logs data/raw

      - name: Run real scraper (Ixigo, all routes x windows)
        env:
          FAREBHARAT_CI: "1"
        timeout-minutes: 25
        run: |
          python scheduler.py --once || echo "scraper had errors (continuing)"

      - name: Verify real quotes exist (no demo data)
        run: |
          python -c "from db import get_session, FareQuote; s=get_session(); n=s.query(FareQuote).filter(FareQuote.source!='demo').count(); s.close(); print('real quotes:', n); import sys; sys.exit(0 if n>0 else 1)" \
          || echo "WARNING: no real quotes this run — index will not be rebuilt"

      - name: Rebuild APIx index (real data only)
        run: python build_index.py

      - name: Commit updated data
        run: |
          git config user.name  "farebharat-bot"
          git config user.email "farebharat-bot@users.noreply.github.com"
          git add data/apix.db data/raw/ logs/scraper.log || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto: APIx 6-hourly snapshot + real ixigo fares $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
